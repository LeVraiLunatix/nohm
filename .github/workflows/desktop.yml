name: Desktop (Windows installer)

# Builds the standalone Nohm Windows app: a Tauri shell that spawns the bundled Node server as a
# sidecar (see src-tauri/scripts/prepare-resources.mjs). Produces an NSIS installer plus the
# updater artifacts (the signed .zip and latest.json), and publishes a draft GitHub Release.
#
# Triggered manually, or by pushing a tag like `v0.1.0`.
#
# Required repo secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of src-tauri/.nohm-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if the key has none)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: rel
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Nohm ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=Nohm dev build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri.conf.json's beforeBuildCommand runs `npm run build` + prepare-resources.mjs, but do
      # the client build here too so a failure is reported before the Rust compile starts.
      - run: npm run build

      - name: Build installer + draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.rel.outputs.tag }}
          releaseName: ${{ steps.rel.outputs.name }}
          releaseBody: |
            Application Windows autonome de Nohm (installateur NSIS).
            Le serveur est embarqué : rien à lancer à côté. Mises à jour automatiques
            au démarrage à partir des prochaines versions.
          releaseDraft: true
          prerelease: false
          projectPath: .
          includeUpdaterJson: true
